name: Deploy Movira Control to S3 and CloudFront

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: movira-control-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-github-actions-deploy
  FRONTEND_BUCKET: web-s3-movira-control
  CLOUDFRONT_DISTRIBUTION_ID: E5RHB3IK3X8KZ

jobs:
  deploy:
    name: Build and deploy Movira Control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate S3 bucket
        run: |
          aws s3api head-bucket \
            --bucket "${FRONTEND_BUCKET}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        run: npm run build:production

      - name: Deploy versioned assets
        run: |
          aws s3 sync dist/assets/ "s3://${FRONTEND_BUCKET}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy public files
        run: |
          aws s3 sync dist/ "s3://${FRONTEND_BUCKET}/" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=3600"

      - name: Deploy application entrypoint
        run: |
          aws s3 cp dist/index.html \
            "s3://${FRONTEND_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
