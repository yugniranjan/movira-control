name: Deploy Movira Control to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: movira-control-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-github-actions-deploy
  FRONTEND_BUCKET: web-s3-movira-control
  CLOUDFRONT_DISTRIBUTION_ID: E5RHB3IK3X8KZ
  APP_URL: https://control.movira360.com

jobs:
  deploy:
    name: Build and deploy Movira Control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "072508717210"
          role-session-name: movira-control-${{ github.run_id }}

      - name: Validate S3 bucket
        run: |
          aws s3api head-bucket \
            --bucket "${FRONTEND_BUCKET}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp build provenance
        run: |
          printf '{"commit":"%s","runId":"%s","builtAt":"%s"}\n' \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json

      - name: Build production frontend
        run: npm run build:production

      - name: Deploy versioned assets
        run: |
          aws s3 sync dist/assets/ "s3://${FRONTEND_BUCKET}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy public files
        run: |
          aws s3 sync dist/ "s3://${FRONTEND_BUCKET}/" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public,max-age=3600"

      - name: Deploy application entrypoint
        run: |
          aws s3 cp dist/index.html \
            "s3://${FRONTEND_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Verify production deployment
        run: |
          BUILD_INFO="$(curl --fail --silent --show-error \
            "${APP_URL}/build-info.json?run=${GITHUB_RUN_ID}")"
          test "$(printf '%s' "${BUILD_INFO}" | jq -r '.commit')" = "${GITHUB_SHA}"

          API_STATUS="$(curl --silent --show-error \
            --output /tmp/movira-control-api-smoke.json \
            --write-out '%{http_code}' \
            "${APP_URL}/api/control/locations/all")"
          test "${API_STATUS}" = "401"
          test "$(jq -r '.statusCode' /tmp/movira-control-api-smoke.json)" = "401"
