name: Deploy frontend to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: production
        type: choice
        options:
          - production

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-github-actions-deploy
  ARTIFACT_BUCKET: movira-deploy-072508717210-ap-south-1
  CLOUDFRONT_DISTRIBUTION_ID: E3BK0WD0H75QO0
  INSTANCE_ID: i-04b24ccadd1321a1c
  APP_URL: https://dfu5picvz3zde.cloudfront.net

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load production build config
        run: |
          echo "VITE_APP_ENV=production" >> "$GITHUB_ENV"
          echo "VITE_API_BASE_URL=/api" >> "$GITHUB_ENV"
          echo "VITE_CRM_API_BASE_URL=/crm-api/api" >> "$GITHUB_ENV"
          echo "VITE_CRM_PUBLIC_BASE=/crm-api" >> "$GITHUB_ENV"
          echo "VITE_CUSTOMER_APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "VITE_PUBLIC_APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          VITE_ENCRYPTION_KEY="$(aws ssm get-parameter \
            --name /movira/prod/frontend/VITE_ENCRYPTION_KEY \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text)"
          echo "VITE_ENCRYPTION_KEY=${VITE_ENCRYPTION_KEY}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Package frontend
        run: tar -czf frontend.tar.gz -C dist .

      - name: Upload artifact
        run: aws s3 cp frontend.tar.gz "s3://${ARTIFACT_BUCKET}/frontend.tar.gz"

      - name: Deploy frontend on EC2
        run: |
          cat > /tmp/movira-frontend-ssm-commands.json <<COMMANDS
          {
            "commands": [
              "set -euo pipefail",
              "aws s3 cp s3://${ARTIFACT_BUCKET}/frontend.tar.gz /tmp/movira-frontend.tar.gz --region ${AWS_REGION}",
              "mkdir -p /opt/movira/frontend",
              "rm -rf /opt/movira/frontend/*",
              "tar --warning=no-unknown-keyword -xzf /tmp/movira-frontend.tar.gz -C /opt/movira/frontend",
              "systemctl restart nginx"
            ]
          }
          COMMANDS

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Movira frontend from GitHub Actions" \
            --parameters file:///tmp/movira-frontend-ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)"

          if ! aws ssm wait command-executed --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"; then
            aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,ResponseCode:ResponseCode}'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
